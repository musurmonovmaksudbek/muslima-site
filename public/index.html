<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muslima uchun</title>
<meta name="theme-color" content="#14060d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌹%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="topbar">
  <div class="progress"><span id="bar"></span></div>
  <div class="counter"><b id="cur">1</b> / <span id="tot">16</span></div>
</header>

<main id="stage" aria-live="polite"></main>

<nav class="nav">
  <button id="prev" class="nbtn" aria-label="Oldingi bob">‹</button>
  <div id="dots" class="dots" role="tablist"></div>
  <button id="next" class="nbtn" aria-label="Keyingi bob">›</button>
</nav>

<div class="music" id="music">
  <button id="mPlay" class="mbtn" aria-label="Musiqani to'xtatish / davom ettirish" title="Play / Pause">❚❚</button>
  <button id="mMute" class="mbtn" aria-label="Ovozni o'chirish / yoqish" title="Mute / Unmute">♪</button>
</div>

<button id="enableMusic" class="enable" hidden>
  <span class="note">♫</span> Musiqani yoqish <span class="note">♫</span>
</button>

<script src="app.js"></script>
</body>
</html>
